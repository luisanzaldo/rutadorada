# Construye el sitio y lo despliega en Cloudflare Pages.
#
# Sustituye a la integración Git del panel de Cloudflare, que ya no se ofrece al
# crear proyectos nuevos. Tener el despliegue aquí también deja el filtrado de
# builds en código: paths-ignore cumple la misma función que el ignoreCommand de
# vercel.json, pero versionado y revisable.
#
# Los borradores y la programación no alteran el sitio publicado (nada en src/ ni
# en scripts/ los lee), así que no merecen un build.

name: Desplegar en Cloudflare Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'drafts/**'
      - 'scheduled/**'
      - 'rss-state.json'
  workflow_dispatch:

# El bot puede publicar varias veces seguidas; basta con desplegar el último estado.
concurrency:
  group: deploy-cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Construir
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_GA4_MEASUREMENT_ID: ${{ secrets.PUBLIC_GA4_MEASUREMENT_ID }}
          PUBLIC_CLARITY_PROJECT_ID: ${{ secrets.PUBLIC_CLARITY_PROJECT_ID }}
          PUBLIC_COOKIEYES_ID: ${{ secrets.PUBLIC_COOKIEYES_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          HASH_LUISANZALDO_B64: ${{ secrets.HASH_LUISANZALDO_B64 }}
          HASH_RAMONFIGUEROA_B64: ${{ secrets.HASH_RAMONFIGUEROA_B64 }}
          GITHUB_REPO: ${{ secrets.GH_REPO }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          CANNES_SHEET_ID: ${{ secrets.CANNES_SHEET_ID }}
          CANNES_SHEET_RANGE: ${{ secrets.CANNES_SHEET_RANGE }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_CALENDAR_DATA_SOURCE_ID: ${{ secrets.NOTION_CALENDAR_DATA_SOURCE_ID }}

      - name: Desplegar
        run: npx --yes wrangler@3 pages deploy dist --project-name=rutadorada --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
