# Construye el sitio y lo despliega en Cloudflare Pages.
#
# Sustituye a la integración Git del panel de Cloudflare, que ya no se ofrece al
# crear proyectos nuevos. Tener el despliegue aquí también deja el filtrado de
# builds en código: paths-ignore cumple la misma función que el ignoreCommand de
# vercel.json, pero versionado y revisable.
#
# Los borradores y la programación no alteran el sitio publicado (nada en src/ ni
# en scripts/ los lee), así que no merecen un build.

name: Desplegar en Cloudflare Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'drafts/**'
      - 'scheduled/**'
      - 'rss-state.json'
      - '*.sql'
  workflow_dispatch:

# El bot puede publicar varias veces seguidas; basta con desplegar el último estado.
concurrency:
  group: deploy-cloudflare-pages
  cancel-in-progress: true

# La ingesta de imágenes reescribe el frontmatter y lo commitea.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Lleva a R2 las imágenes de las notas recién publicadas, vengan del bot o
      # del CMS. Sustituye al viejo prebuild download-images.mjs, que descargaba
      # las imágenes al repositorio en cada build.
      #
      # Es incremental: una nota cuya imagen ya es de R2 no se toca, así que un
      # despliegue normal procesa cero y termina en menos de un segundo. Y es
      # tolerante: si el medio de origen ha caído, esa nota se salta con su URL
      # intacta y el despliegue continúa. Un origen muerto no tumba una
      # publicación; se reintenta en la siguiente.
      #
      # Va ANTES de construir: al revés desplegaría las notas sin migrar.
      - name: Ingerir imágenes nuevas a R2
        run: node scripts/ingest-images.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Se commitea con GITHUB_TOKEN a propósito: GitHub no dispara workflows con
      # los eventos que genera ese token, así que no hay bucle de despliegues.
      # Con un PAT sí lo habría.
      - name: Commitear el frontmatter migrado
        run: |
          if [ -n "$(git status --porcelain src/content/posts)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/content/posts
            git commit -m "ingest: mover a R2 las imágenes de las notas nuevas"
            git push
          else
            echo "Sin cambios: todas las imágenes ya estaban en R2."
          fi

      # Astro solo inlinea import.meta.env desde un archivo .env. Si las variables
      # llegan únicamente como entorno del proceso —como pasa en CI— compila
      # process.env.LO_QUE_SEA, que en Cloudflare Workers es un objeto vacío: los
      # secretos llegan undefined y todo el panel admin falla en silencio.
      # Por eso se materializa el .env antes de construir.
      - name: Generar .env para el build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_GA4_MEASUREMENT_ID: ${{ secrets.PUBLIC_GA4_MEASUREMENT_ID }}
          PUBLIC_CLARITY_PROJECT_ID: ${{ secrets.PUBLIC_CLARITY_PROJECT_ID }}
          PUBLIC_COOKIEYES_ID: ${{ secrets.PUBLIC_COOKIEYES_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          HASH_LUISANZALDO_B64: ${{ secrets.HASH_LUISANZALDO_B64 }}
          HASH_RAMONFIGUEROA_B64: ${{ secrets.HASH_RAMONFIGUEROA_B64 }}
          GITHUB_REPO: ${{ secrets.GH_REPO }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          CANNES_SHEET_ID: ${{ secrets.CANNES_SHEET_ID }}
          CANNES_SHEET_RANGE: ${{ secrets.CANNES_SHEET_RANGE }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_CALENDAR_DATA_SOURCE_ID: ${{ secrets.NOTION_CALENDAR_DATA_SOURCE_ID }}
        run: |
          for v in PUBLIC_SUPABASE_URL PUBLIC_SUPABASE_ANON_KEY PUBLIC_GA4_MEASUREMENT_ID \
                   PUBLIC_CLARITY_PROJECT_ID PUBLIC_COOKIEYES_ID SUPABASE_SERVICE_ROLE_KEY \
                   JWT_SECRET HASH_LUISANZALDO_B64 HASH_RAMONFIGUEROA_B64 GITHUB_REPO \
                   GITHUB_TOKEN GOOGLE_API_KEY CANNES_SHEET_ID CANNES_SHEET_RANGE \
                   GROQ_API_KEY NOTION_TOKEN NOTION_CALENDAR_DATA_SOURCE_ID; do
            printf '%s=%s\n' "$v" "${!v}" >> .env
          done
          echo "Variables escritas: $(wc -l < .env)"

      # El endpoint /api/posts/publish ya escribe en la base en el acto, así que
      # este paso es una red de seguridad con dos funciones: cubre al bot de
      # Telegram, que sigue commiteando directo a GitHub sin pasar por el endpoint,
      # y atrapa cualquier desfase por un fallo puntual de Supabase al publicar.
      #
      # Va ANTES de construir y después de generar el .env, del que toma las
      # credenciales. El orden es crítico desde que el sitio lee de la base: si
      # corriera tras el despliegue —como hacía cuando el build leía los
      # markdown— una nota del bot entraría en Supabase después de que el sitio
      # ya se hubiera construido sin ella, y no aparecería hasta el siguiente
      # despliegue.
      #
      # ┌─────────────────────────────────────────────────────────────────────┐
      # │ NO RETIRAR ESTE PASO MIENTRAS EL BOT COMMITEE DIRECTO A GIT         │
      # │                                                                     │
      # │ El bot NO escribe en Supabase: solo commitea markdown. Este         │
      # │ --commit es el único puente por el que sus notas llegan a la base.  │
      # │ Sin él, el bot publicaría, esto desplegaría, y no se vería nada.    │
      # │                                                                     │
      # │ El puente sobra en la FASE 6, cuando el bot pase a llamar al        │
      # │ endpoint. No antes. Una versión anterior de este aviso decía        │
      # │ "quitar este paso en la fase 5", y seguirlo dejaba al bot mudo.     │
      # └─────────────────────────────────────────────────────────────────────┘
      #
      # --prune se retiró al empezar la fase 5. Borraba las filas cuyo slug no
      # estuviera en src/content/posts: correcto mientras git sea la fuente de
      # verdad, destructivo en cuanto el sitio lea de la base y haya contenido
      # que viva solo en Supabase.
      #
      # Sin la bandera el script SIGUE LISTANDO las huérfanas en este log, pero
      # no las toca. Conviene mirarlas: el bot puede borrar una nota publicada
      # (deletePost en su github.js) sin limpiar Supabase, y esa fila quedaría
      # como fantasma —invisible hoy, visible en cuanto el sitio lea de la base.
      # Se limpian a mano con --prune hasta que la fase 6 cierre esa ruta.
      - name: Sincronizar Supabase con git
        run: node scripts/import-posts.mjs --commit

      - name: Construir
        run: npm run build

      # Salvaguarda: si un secreto no se inlinea, queda como process.env en el bundle
      # y en Cloudflare Workers eso es un objeto vacio, asi que llega undefined y el
      # panel admin falla en silencio. Fue exactamente lo que paso al montar el CI.
      #
      # Se vigilan los secretos de los que dependen login y publicacion. Queda fuera
      # SUPABASE_SERVICE_ROLE_KEY: aparece como process.env en el chunk de cannes por
      # como Vite reparte los modulos, aunque su valor si se inlinea donde se usa.
      - name: Verificar que los secretos se inlinearon
        run: |
          if grep -rq "process\.env\.JWT_SECRET\|process\.env\.HASH_\|process\.env\.GITHUB_TOKEN\|process\.env\.GITHUB_REPO" dist/_worker.js; then
            echo "ERROR: hay secretos sin inlinear en el bundle (quedaron como process.env)."
            grep -rho "process\.env\.[A-Z_]*" dist/_worker.js | sort -u
            exit 1
          fi
          echo "OK: los secretos se inlinearon correctamente."

      - name: Desplegar
        run: npx --yes wrangler@3 pages deploy dist --project-name=rutadorada --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Reconcilia la tabla posts de Supabase con lo que hay en git.
      #
